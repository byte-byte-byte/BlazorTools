<!DOCTYPE html>
<!-- data-accent= cyan / violet / mint / amber-->
<html lang="zh-CN" data-accent="cyan">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BlazorTools</title>
    <base href="/" />
    <meta name="theme-color" content="#04060d" />
    <meta name="description" content="BlazorTools · 前端在线工具箱（WebAssembly 本地计算；IP Info 与 DNS泄露需调用第三方接口）" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BlazorTools.Client.styles.css" rel="stylesheet" />
    <!-- RCL 惰性组件的 CSS 隔离样式：独立静态资源，需显式引用，与程序集加载时机无关 -->
    <link href="_content/BlazorTools.Cryptography/BlazorTools.Cryptography.bundle.scp.css" rel="stylesheet" />
    <!-- NEBULA-HUD 科技风主题：必须放在最后，用于覆盖 Bootstrap 默认样式 -->
    <link href="css/theme.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <!-- 启动画面：Blazor 渲染根组件后会自动替换掉这段内容 -->
        <div class="boot" role="status" aria-live="polite">
            <div class="boot-ring"></div>
            <div class="boot-title">BLAZOR//TOOLS</div>
            <div class="boot-msg">Initializing WebAssembly Runtime…</div>
            <div class="boot-bar"><i></i></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/search-hotkey.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script type="module">
        import { BrotliDecode } from './js/decode.min.js';
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                if (type !== 'dotnetjs' && location.hostname !== 'localhost') {
                    return (async function () {
                        const response = await fetch(defaultUri + '.br', { cache: 'no-cache' });
                        if (!response.ok) {
                            throw new Error(response.statusText);
                        }
                        const originalResponseBuffer = await response.arrayBuffer();
                        const originalResponseArray = new Int8Array(originalResponseBuffer);
                        const decompressedResponseArray = BrotliDecode(originalResponseArray);
                        const contentType = type ===
                            'dotnetwasm' ? 'application/wasm' : 'application/octet-stream';
                        return new Response(decompressedResponseArray,
                            { headers: { 'content-type': contentType } });
                    })();
                }
            }
        });
    </script>
    <script>
        /* navigator.serviceWorker.register('service-worker.js');*/
    </script>
</body>

</html>
